name: Release
# Push a tag like v0.2.0 (scripts/publish.ps1 does this) to build installers for Windows,
# macOS and Linux and attach them to a draft GitHub release. Review the draft, then publish it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.2.0)
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release (once)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Vesper ${TAG#v}" --generate-notes
          fi

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.AppImage dist/*.deb)
          echo "Uploading: ${files[*]}"
          gh release upload "$TAG" "${files[@]}" --clobber
